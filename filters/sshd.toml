name = "sshd"
description = "OpenSSH authentication failures"
files = ["/var/log/secure", "/var/log/auth.log"]
journal = { identifiers = ["sshd", "sshd-session"], units = ["sshd.service", "ssh.service"] }
prefilter = ["sshd"]
ports = [22]
patterns = [
  '(?:sshd(?:-session)?\[\d+\]: )?Failed (?:password|publickey|keyboard-interactive/pam|none) for (?:invalid user )?<F-USER>.+</F-USER> from <HOST>(?: port \d+)?(?: ssh\d*)?(?:: \S+ \S+)?(?: \[preauth\])?$',
  '(?:sshd(?:-session)?\[\d+\]: )?Invalid user <F-USER>.*</F-USER> from <HOST>(?: port \d+)?$',
  '(?:sshd(?:-session)?\[\d+\]: )?(?:error: )?maximum authentication attempts exceeded for (?:invalid user )?<F-USER>.+</F-USER> from <HOST>(?: port \d+)?(?: ssh\d*)?(?: \[preauth\])?$',
  '(?:sshd(?:-session)?\[\d+\]: )?(?:error: )?Received disconnect from <HOST>(?: port \d+)?:\s*\d+: .*\[preauth\]',
  '(?:sshd(?:-session)?\[\d+\]: )?Disconnected from (?:invalid|authenticating) user <F-USER>.+</F-USER> <HOST>(?: port \d+)? \[preauth\]$',
  '(?:sshd(?:-session)?\[\d+\]: )?Connection closed by (?:invalid|authenticating) user <F-USER>.+</F-USER> <HOST>(?: port \d+)? \[preauth\]$',
  '(?:sshd(?:-session)?\[\d+\]: )?(?:error: )?(?:PAM: )?Authentication failure for .* from <HOST>',
  '(?:sshd(?:-session)?\[\d+\]: )?User <F-USER>.+</F-USER> from <HOST> not allowed because',
  '(?:sshd(?:-session)?\[\d+\]: )?(?:error: )?Bad protocol version identification .* from <HOST>',
  '(?:sshd(?:-session)?\[\d+\]: )?banner exchange: Connection from <HOST>(?: port \d+)?: invalid format',
  '(?:sshd(?:-session)?\[\d+\]: )?(?:error: )?kex_exchange_identification: .* <HOST>',
  '(?:sshd(?:-session)?\[\d+\]: )?pam_unix\(sshd:auth\): authentication failure; .*rhost=<HOST>',
  '(?:sshd(?:-session)?\[\d+\]: )?Unable to negotiate with <HOST>(?: port \d+)?: no matching',
]
ignore = [
  'Accepted (?:password|publickey)',
]
