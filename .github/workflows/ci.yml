name: ci
on: [push, pull_request]
env:
  CARGO_TERM_COLOR: always
  MAX_BINARY_BYTES: 5000000
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - run: cargo build --release
      - name: binary size gate
        run: |
          size=$(stat -c %s target/release/minsec)
          echo "minsec: $size bytes"
          test "$size" -le "$MAX_BINARY_BYTES"
      - name: shared-library surface (glibc + libgcc_s only)
        run: scripts/check-glibc.sh target/release/minsec 99
      - name: nftables end-to-end (private netns)
        run: |
          sudo apt-get install -y nftables
          sudo bash tests/e2e-nft.sh "$PWD/target/release/minsec"
